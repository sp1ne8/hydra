services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: hydra
      POSTGRES_PASSWORD: hydra_local
      POSTGRES_DB: hydra
    ports:
      - "127.0.0.1:55440:5432"
    volumes:
      - hydra_accounts:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydra -d hydra"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  hydra_accounts:
